<!DOCTYPE html>
<html>
    <head>
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta charset="UTF-8">
        <!-- Inline on purpose: assets/style.css is only loaded by the app itself, so
             anything shown before the wasm starts has to be styled here. Colors match
             style.css's light/dark tokens to avoid a white flash in dark mode. -->
        <style>
            body { margin: 0; }
            .app-loading {
                background: #ffffff;
                color: #6b6b76;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 16px;
                min-height: 100vh;
                font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            }
            .app-loading-spinner {
                width: 32px;
                height: 32px;
                border: 3px solid currentColor;
                border-right-color: transparent;
                border-radius: 50%;
                animation: app-loading-spin 0.8s linear infinite;
            }
            @media (prefers-color-scheme: dark) {
                .app-loading { background: #1b1b1f; color: #9a9aa5; }
            }
            @keyframes app-loading-spin { to { transform: rotate(360deg); } }
            /* Dioxus appends the app next to this placeholder instead of replacing it,
               so hide it as soon as anything else is rendered into #main. */
            #main > .app-loading:not(:only-child) { display: none; }
        </style>
    <link rel="preload" as="script" href="/japanese-input/assets/japanese-input-webside-dxhc0ffe0303bdf1c55.js" crossorigin></head>
    <body>
        <div id="main">
            <div class="app-loading">
                <div class="app-loading-spinner"></div>
                <div>Loading…</div>
            </div>
        </div>
    <script type="module" async src="/japanese-input/assets/japanese-input-webside-dxhc0ffe0303bdf1c55.js"></script>
            </body>
</html>
