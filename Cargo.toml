[workspace]
members = ["compile-data-set", "hands", "japanese-input", "japanese-input-py","kanji-vg"]
exclude = ["fit-recognizer", "optimize-stroke-match-weights", "stats", "optimize-recognizer", "review-stroke-matching", "ai-stroke-mapping", "triage-stroke-matching", "kanji-draw", "iced_kanji_grid", "fuzzy-stroke-match", "webside"]

resolver = "3"
[profile.release]
debug = true


[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -2 }

#pedantic
needless_pass_by_value = "allow"
struct_field_names = "allow"
unreadable_literal = "allow"

# restriction
blanket_clippy_restriction_lints = "allow"
implicit_return = "allow"
missing_docs_in_private_items = "allow"
min_ident_chars = "allow"
separated_literal_suffix = "allow"
single_call_fn = "allow"
float_arithmetic = "allow"
question_mark_used = "allow"
arbitrary_source_item_ordering = "allow"
shadow_reuse = "allow"
module_name_repetitions = "allow"
pattern_type_mismatch = "allow"
non_ascii_literal = "allow"
multiple_inherent_impl = "allow"
impl_trait_in_params = "allow"