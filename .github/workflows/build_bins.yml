name: Build japanese_input addon

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest        # macOS arm64
          - os: macos-15-intel      # macOS x86_64
    env:
      PYO3_BUILD_EXTENSION_MODULE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build with cargo (non-macOS)
        if: runner.os != 'macOS'
        run: cargo build --release

      - name: Build with cargo (macOS)
        if: runner.os == 'macOS'
        run: |
          export RUSTFLAGS="-C link-arg=-undefined -C link-arg=dynamic_lookup"
          cargo build --release
      
      - name: Collect built binary
        shell: bash
        run: |
          mkdir -p dist
          case "${{ runner.os }}" in
            Linux)
              cp target/release/libjapanese_input_py.so \
                 dist/japanese_input_py.linux-x86_64.so
              ;;
            macOS)
              arch="$(uname -m)"
              cp target/release/libjapanese_input_py.dylib \
                 "dist/japanese_input_py.macos-${arch}.so"
              ;;
            Windows)
              cp target/release/japanese_input_py.dll \
                 dist/japanese_input_py.windows-x86_64.pyd
              ;;
          esac

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: japanese_input-${{ matrix.os }}
          path: dist/*

  package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Generate reference data
        run: cargo test tests::generate_reference_data

      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble addon directory
        run: |
          mkdir -p addon_out
          cp -r japanese_input_anki/* addon_out/
          cp -r media/  addon_out/
          mkdir -p addon_out/lib
          # Native binaries — one per platform
          cp artifacts/japanese_input-ubuntu-latest/*.so    addon_out/lib/
          cp artifacts/japanese_input-windows-latest/*.pyd  addon_out/lib/
          cp artifacts/japanese_input-macos-latest/*.so     addon_out/lib/
          cp artifacts/japanese_input-macos-15-intel/*.so   addon_out/lib/

          # Data file shipped under user_files (preserved across addon updates)
          mkdir -p addon_out/user_files/assets
          cp data/generated/reference_data.bin addon_out/user_files/assets/reference_data.bin

          wget -P  addon_out/user_files/assets/ https://github.com/Drodofsky/regonizer-model/raw/refs/heads/main/recognizer2_tuned.bin
          
          # KanjiVG license attribution
          cp data/License.txt addon_out/user_files/assets/LICENSE.txt

          # own license
          cp LICENSE addon_out/LICENSE.txt

          # own readme

          cp readme.md addon_out/readme.md

      - name: Zip addon
        run: |
          cd addon_out
          zip -r ../japanese_input.ankiaddon *

      - name: Upload combined addon zip
        uses: actions/upload-artifact@v4
        with:
          name: japanese_input-anki-addon
          path: japanese_input.ankiaddon
