[package]
name = "japanese-input-py"
version = "0.2.0"
edition = "2024"

[lib]
name = "japanese_input_py"
crate-type = ["cdylib"]

[dependencies]
pyo3 = {version = "0.29", features = ["extension-module","experimental-inspect", "abi3-py38"]}
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
rayon = "1"
japanese-input = {path = "../japanese-input"}


[lints]
workspace = true
